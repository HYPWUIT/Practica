<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The ?v= is not decoration. Browsers cache favicons in a store that
         ignores Cache-Control and survives a hard refresh, so the only
         dependable way to ship a new icon is to change its URL. Bump it
         whenever favicon.svg changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b533a" />
    <meta
      name="description"
      content="Sage &amp; Oak — solid timber furniture, built to be repaired rather than replaced."
    />
    <title>Sage &amp; Oak</title>
    <script>
      // Runs before first paint so a night-mode visitor never gets a white
      // flash while the bundle loads. ThemeProvider takes over from here and
      // reads the same key.
      try {
        var stored = localStorage.getItem('sage-oak-theme')
        var dark =
          stored === 'dark' ||
          ((!stored || stored === 'system') &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
